# SPDX-License-Identifier: GPL-2.0-only
name: check pinned libusb

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check latest stable libusb
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          latest=$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/libusb/libusb/releases/latest | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          case "$latest" in
            v1.0.30) echo "pinned libusb is current: $latest" ;;
            v[0-9]*) echo "newer stable libusb available: $latest (pinned v1.0.30)" >&2; exit 1 ;;
            *) echo "unexpected latest release tag: $latest" >&2; exit 1 ;;
          esac
