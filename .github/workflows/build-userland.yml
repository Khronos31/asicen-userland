name: Build userland skeleton

on:
  push:
    branches: [main, dot/usb-model-support-0.1.0, release/0.1.0]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libusb-1.0-0-dev libpcsclite-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/asicen-probe

  macos-arm64-intermediate:
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools and build-only PC/SC headers
        run: brew install ninja pcsc-lite pkgconf
      - name: Create immutable source and pinned dependency inputs
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/asicen-userland-source.tar.gz"
          curl -fsSL --retry 2 \
            -o "$RUNNER_TEMP/libusb-1.0.30.tar.bz2" \
            https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
          echo 'fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf  '"$RUNNER_TEMP/libusb-1.0.30.tar.bz2" \
            | shasum -a 256 -c -
          pcsc_prefix="$(brew --prefix pcsc-lite)"
          export PKG_CONFIG_PATH="$pcsc_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          pkg-config --modversion libpcsclite > "$RUNNER_TEMP/pcsc-lite-version.txt"
          brew info --json=v2 pcsc-lite | python3 -c 'import json,sys; f=json.load(sys.stdin)["formulae"][0]; print(json.dumps(f["license"], sort_keys=True, separators=(",", ":")))' > "$RUNNER_TEMP/pcsc-lite-license.txt"
      - name: Build, test, and audit firmware-free macOS candidate
        shell: bash
        run: |
          pcsc_prefix="$(brew --prefix pcsc-lite)"
          pcsc_version="$(cat "$RUNNER_TEMP/pcsc-lite-version.txt")"
          pcsc_license="$(cat "$RUNNER_TEMP/pcsc-lite-license.txt")"
          sh scripts/build-macos-static.sh \
            --source-snapshot "$RUNNER_TEMP/asicen-userland-source.tar.gz" \
            --libusb-archive "$RUNNER_TEMP/libusb-1.0.30.tar.bz2" \
            --pcsc-include-dir "$pcsc_prefix/include/PCSC" \
            --pcsc-version "$pcsc_version" \
            --pcsc-license-expression "$pcsc_license" \
            --output "$RUNNER_TEMP/asicen-macos-arm64-intermediate"
      - name: Verify modified-libUSB relink recipe and IPC smoke
        run: sh scripts/test-macos-libusb-relink.sh "$RUNNER_TEMP/asicen-macos-arm64-intermediate"
      - name: Bundle the pinned loader into the macOS candidate
        run: |
          set -euo pipefail
          cp firmware/asicen-loader.bin "$RUNNER_TEMP/asicen-loader.bin"
          python3 scripts/package-macos-variant.py \
            --candidate "$RUNNER_TEMP/asicen-macos-arm64-intermediate" \
            --firmware "$RUNNER_TEMP/asicen-loader.bin" \
            --output "$RUNNER_TEMP/asicen-userland-0.1.0-darwin-arm64"
      - name: Upload macOS candidate
        uses: actions/upload-artifact@v4
        with:
          name: rc-darwin-arm64
          path: ${{ runner.temp }}/asicen-userland-0.1.0-darwin-arm64.tar.gz
          if-no-files-found: error
          retention-days: 3

  linux-candidates:
    name: Linux ${{ matrix.arch }} static commands and IFD candidates
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Prepare snapshot, libusb, licenses, and firmware outside the checkout
        run: sh scripts/ci-prepare-linux-inputs.sh --dest "$RUNNER_TEMP/inputs"
      - name: Build musl static commands and musl IFD
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$RUNNER_TEMP/inputs:/inputs:ro" \
            -v "$RUNNER_TEMP/work:/work" \
            -w /src alpine:3.22 sh -euxc '
              apk add --no-cache cmake samurai gcc g++ make pkgconf python3 binutils \
                tar gzip bzip2 curl linux-headers coreutils pcsc-lite-dev;
              if ! command -v ninja >/dev/null 2>&1; then
                ln -sf "$(command -v samu)" /usr/local/bin/ninja;
              fi
              sh scripts/build-linux-static.sh \
                --output /work/commands \
                --source-snapshot /inputs/asicen-userland-source.tar.gz \
                --libusb-archive /inputs/libusb-1.0.30.tar.bz2 \
                --musl-license /inputs/musl-1.2.5-COPYRIGHT \
                --gcc-copying3 /inputs/gcc-COPYING3 \
                --gcc-runtime-exception /inputs/gcc-COPYING.RUNTIME;
              sh scripts/build-linux-ifd.sh \
                --libc musl \
                --output /work/ifd-musl \
                --source-snapshot /inputs/asicen-userland-source.tar.gz \
                --gcc-copying3 /inputs/gcc-COPYING3 \
                --gcc-runtime-exception /inputs/gcc-COPYING.RUNTIME \
                --musl-license /inputs/musl-1.2.5-COPYRIGHT'
      - name: Build glibc 2.31 IFD
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$RUNNER_TEMP/inputs:/inputs:ro" \
            -v "$RUNNER_TEMP/work:/work" \
            -w /src debian:11 sh -euxc '
              find /etc/apt/sources.list.d -type f -delete;
              printf "%s\n" \
                "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260825T000000Z bullseye main" \
                "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260825T000000Z bullseye-security main" \
                > /etc/apt/sources.list;
              apt-get update;
              apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config \
                libpcsclite-dev binutils python3 ca-certificates;
              sh scripts/build-linux-ifd.sh \
                --libc glibc \
                --output /work/ifd-glibc \
                --source-snapshot /inputs/asicen-userland-source.tar.gz \
                --gcc-copying3 /inputs/gcc-COPYING3 \
                --gcc-runtime-exception /inputs/gcc-COPYING.RUNTIME'
      - name: Package both libc candidates with the pinned loader
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils python3
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/work"
          arch='${{ matrix.arch }}'
          for libc in glibc musl; do
            python3 scripts/package-linux-variant.py \
              --commands "$RUNNER_TEMP/work/commands" \
              --ifd "$RUNNER_TEMP/work/ifd-$libc" \
              --libc "$libc" \
              --firmware "$RUNNER_TEMP/inputs/asicen-loader.bin" \
              --output "$RUNNER_TEMP/work/asicen-userland-0.1.0-linux-$libc-$arch"
          done
      - name: Upload Linux candidates
        uses: actions/upload-artifact@v4
        with:
          name: rc-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/work/asicen-userland-0.1.0-linux-*-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  android-candidates:
    name: Android ${{ matrix.abi }} candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        abi: [aarch64, armv7a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        id: setup-ndk
        with:
          ndk-version: r27d
          add-to-path: false
      - name: Install Android build tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y binutils cmake ninja-build curl bzip2
      - name: Build and package one ABI with the pinned loader
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          libusb="$RUNNER_TEMP/libusb-1.0.30.tar.bz2"
          curl -fsSL --retry 2 -o "$libusb" \
            https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
          echo 'fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf  '"$libusb" | sha256sum -c -
          out="$RUNNER_TEMP/android"
          mkdir -p "$out/commands" "$out/package"
          sh scripts/make-linux-source-snapshot.sh \
            --output "$RUNNER_TEMP/asicen-userland-source.tar.gz"
          sh scripts/build-android.sh --abi "$ABI" \
            --output "$out/commands" \
            --evidence "$out/evidence" \
            --libusb-archive "$libusb"
          python3 scripts/package-android-variant.py --abi "$ABI" \
            --commands "$out/commands" \
            --libusb-archive "$libusb" \
            --ndk "$ANDROID_NDK_HOME" \
            --firmware firmware/asicen-loader.bin \
            --source-archive "$RUNNER_TEMP/asicen-userland-source.tar.gz" \
            --output "$out/package"
          if [ "$ABI" = x86_64 ]; then
            sh scripts/test-android-libusb-relink.sh --abi x86_64 --libusb-archive "$libusb"
          fi
      - name: Upload Android candidate
        uses: actions/upload-artifact@v4
        with:
          name: rc-android-${{ matrix.abi }}
          path: ${{ runner.temp }}/android/package/asicen-userland-0.1.0-android-${{ matrix.abi }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  source-archive:
    name: Corresponding source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the firmware-free source archive
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < VERSION)"
          out="$RUNNER_TEMP/asicen-userland-$version-source.tar.gz"
          sh scripts/make-linux-source-snapshot.sh --output "$out"
          if tar -tzf "$out" | grep -E '(^|/)firmware/|asicen-loader\.bin'; then
            echo 'firmware leaked into corresponding source' >&2
            exit 1
          fi
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: rc-source
          path: ${{ runner.temp }}/asicen-userland-*-source.tar.gz
          if-no-files-found: error
          retention-days: 3

  static-start-x86_64:
    name: Downloaded static x86_64 executable start checks
    needs: linux-candidates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rc-linux-x86_64
          path: ${{ runner.temp }}/downloaded
      - name: Start the exact downloaded static executables
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP"/downloaded/*.tar.gz; do
            extract="$RUNNER_TEMP/extract-$(basename "$archive" .tar.gz)"
            mkdir -p "$extract"
            tar -xzf "$archive" -C "$extract"
            root=$(find "$extract" -mindepth 1 -maxdepth 1 -type d | head -n 1)
            for program in asicend asicen-ts asicenctl; do "$root/bin/$program" --help; done
          done

  static-start-aarch64:
    name: Downloaded static aarch64 executable start checks
    needs: linux-candidates
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rc-linux-aarch64
          path: ${{ runner.temp }}/downloaded
      - name: Start the exact downloaded static executables
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP"/downloaded/*.tar.gz; do
            extract="$RUNNER_TEMP/extract-$(basename "$archive" .tar.gz)"
            mkdir -p "$extract"
            tar -xzf "$archive" -C "$extract"
            root=$(find "$extract" -mindepth 1 -maxdepth 1 -type d | head -n 1)
            for program in asicend asicen-ts asicenctl; do "$root/bin/$program" --help; done
          done

  release-candidate:
    name: Assemble release-candidate artifact
    needs: [build, macos-arm64-intermediate, linux-candidates, android-candidates, source-archive, static-start-x86_64, static-start-aarch64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rc-*
          merge-multiple: true
          path: release-candidate
      - name: Verify the px4 v0.1.10 archive set and write SHA256SUMS
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < VERSION)"
          python3 - "$version" <<'PY'
          from pathlib import Path
          import sys
          version = sys.argv[1]
          expected = {
              f"asicen-userland-{version}-linux-glibc-x86_64.tar.gz",
              f"asicen-userland-{version}-linux-musl-x86_64.tar.gz",
              f"asicen-userland-{version}-linux-glibc-aarch64.tar.gz",
              f"asicen-userland-{version}-linux-musl-aarch64.tar.gz",
              f"asicen-userland-{version}-darwin-arm64.tar.gz",
              f"asicen-userland-{version}-android-aarch64.tar.gz",
              f"asicen-userland-{version}-android-armv7a.tar.gz",
              f"asicen-userland-{version}-android-x86_64.tar.gz",
              f"asicen-userland-{version}-source.tar.gz",
          }
          actual = {path.name for path in Path("release-candidate").iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"exact archive set required: expected={sorted(expected)} actual={sorted(actual)}")
          PY
          cd release-candidate
          sha256sum asicen-userland-"$version"-*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          if tar -tzf "asicen-userland-$version-source.tar.gz" | grep -E '(^|/)firmware/|asicen-loader\.bin'; then
            echo 'firmware leaked into the source archive' >&2
            exit 1
          fi
      - name: Upload the release-candidate set
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release-candidate
          if-no-files-found: error
          retention-days: 3
