            python3 -c "import ctypes; getattr(ctypes.CDLL(\"/tmp/rc-musl-aarch64/ifd/asicen-userland-ifd.so\"), \"IFDHCreateChannel\")"'

  windows-x86_64:
    needs: source-archive
    # Windows remains implementation/test-only until the WinSCard release.
    name: Windows x64 development cross-build, PE audit, and package regression
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-source
          path: ${{ runner.temp }}/source-archive
      - name: Install host cross-build and audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build make shellcheck python3 binutils
      - name: Download and verify the pinned libusb source archive
        env:
          LIBUSB_ARCHIVE: ${{ runner.temp }}/libusb-1.0.30.tar.bz2
        run: |
          mkdir -p "$RUNNER_TEMP/asicen-windows-toolchain"
          curl -fsSL --retry 2 -o "$LIBUSB_ARCHIVE" \
            https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
          echo 'fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf  '"$LIBUSB_ARCHIVE" | sha256sum -c -
          cp "$LIBUSB_ARCHIVE" "$RUNNER_TEMP/asicen-windows-toolchain/libusb-1.0.30.tar.bz2"
      - name: Check Windows scripts and offline packaging/audit tests
        env:
          LIBUSB_ARCHIVE: ${{ runner.temp }}/libusb-1.0.30.tar.bz2
        run: ASICEN_LIBUSB_1_0_30_ARCHIVE="$LIBUSB_ARCHIVE" scripts/test-windows-packaging.sh
      - name: Cross-build, audit, and package two independent fresh builds
        env:
          LIBUSB_ARCHIVE: ${{ runner.temp }}/libusb-1.0.30.tar.bz2
        run: |
          set -eu
          version="$(tr -d '\n' < VERSION)"
          cache="$RUNNER_TEMP/asicen-windows-toolchain"
          mkdir -p "$RUNNER_TEMP/win/bin-1" "$RUNNER_TEMP/win/bin-2" "$RUNNER_TEMP/win/tests" \
            "$RUNNER_TEMP/win/zip-1" "$RUNNER_TEMP/win/zip-2"
          scripts/build-windows.sh --output "$RUNNER_TEMP/win/bin-1" \
            --test-output "$RUNNER_TEMP/win/tests" --cache "$cache"
          scripts/build-windows.sh --output "$RUNNER_TEMP/win/bin-2" --cache "$cache"
          scripts/audit-artifact.sh --platform windows-x86_64 --build-dir "$RUNNER_TEMP/win/bin-1"
          for run in 1 2; do
            scripts/package-artifact.sh --platform windows-x86_64 --version "$version" \
              --build-dir "$RUNNER_TEMP/win/bin-$run" \
              --libusb-source-archive "$LIBUSB_ARCHIVE" --source-ref "$GITHUB_SHA" \
              --output-dir "$RUNNER_TEMP/win/release-$run"
            cp "$RUNNER_TEMP/win/release-$run/asicen-userland-$version-windows-x86_64.zip" \
              "$RUNNER_TEMP/win/zip-$run/"
          done
          first=$(sha256sum "$RUNNER_TEMP/win/zip-1/asicen-userland-$version-windows-x86_64.zip" | awk '{print $1}')
          second=$(sha256sum "$RUNNER_TEMP/win/zip-2/asicen-userland-$version-windows-x86_64.zip" | awk '{print $1}')
          [ "$first" = "$second" ] || { printf '%s\n' "Windows zip is not reproducible: $first != $second" >&2; exit 1; }
          printf 'windows zip sha256: %s\n' "$first"
          scripts/audit-artifact.sh --platform windows-x86_64 \
            --archive "$RUNNER_TEMP/win/zip-1/asicen-userland-$version-windows-x86_64.zip"
      - name: Corresponding-source Windows static relink proof
        env:
          LIBUSB_ARCHIVE: ${{ runner.temp }}/libusb-1.0.30.tar.bz2
        run: |
          source_root="$RUNNER_TEMP/windows-relink-source"
          mkdir -p "$source_root"
          tar -xzf "$RUNNER_TEMP"/source-archive/*.tar.gz -C "$source_root"
          "$source_root/repository/scripts/test-windows-static-relink.sh" \
            --libusb-source-archive "$source_root/third_party/libusb-1.0.30.tar.bz2" \
            --baseline-asicend "$RUNNER_TEMP/win/bin-1/asicend.exe" \
            --cache "$RUNNER_TEMP/asicen-windows-toolchain"
          find "$source_root" -depth -delete
      - name: Upload Windows CI-only candidate archive (not release distribution)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-candidate
          path: ${{ runner.temp }}/win/zip-1/*.zip
          if-no-files-found: error
      - name: Upload Windows offline test executables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-candidate-tests
          path: ${{ runner.temp }}/win/tests
          if-no-files-found: error

  windows-native-tests:
    name: Windows Server 2022 offline implementation tests
    needs: windows-x86_64
    timeout-minutes: 60
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: win-candidate
          path: ${{ runner.temp }}/win-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: win-candidate-tests
          path: ${{ runner.temp }}/win-candidate-tests
      - name: Diagnose the Windows native test environment (read-only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Show-Acl([string]$path) {
            try {
              if (-not $path -or -not (Test-Path -LiteralPath $path)) {
                Write-Host "acl target=$path exists=False"
                return
              }
              $item = Get-Item -LiteralPath $path -Force
              $acl = Get-Acl -LiteralPath $path
              Write-Host "acl target=$path attributes=$($item.Attributes) owner=$($acl.Owner) protected=$($acl.AreAccessRulesProtected)"
              Write-Host "  sddl=$($acl.Sddl)"
              foreach ($ace in $acl.Access) {
                Write-Host "  ace identity=$($ace.IdentityReference) rights=$($ace.FileSystemRights) type=$($ace.AccessControlType) inherited=$($ace.IsInherited)"
              }
            } catch {
              Write-Host "acl error target=$path error=$($_.Exception.Message)"
            }
          }
          Write-Host '== OS / build =='
          try {
            Write-Host "PSVersion=$($PSVersionTable.PSVersion) PSEdition=$($PSVersionTable.PSEdition)"
            Write-Host "OSVersion=$([System.Environment]::OSVersion.VersionString)"
            $os = Get-CimInstance -ClassName Win32_OperatingSystem
            Write-Host "Caption=$($os.Caption) Version=$($os.Version) BuildNumber=$($os.BuildNumber) ProductType=$($os.ProductType)"
            $current = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
            Write-Host "InstallationType=$($current.InstallationType) DisplayVersion=$($current.DisplayVersion) CurrentBuild=$($current.CurrentBuild)"
          } catch {
            Write-Host "os error=$($_.Exception.Message)"
          }
          Write-Host '== identity =='
          try {
            $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
            Write-Host "User=$($identity.Name) SID=$($identity.User.Value) OwnerSID=$($identity.Owner.Value) IsSystem=$($identity.IsSystem)"
          } catch {
            Write-Host "identity error=$($_.Exception.Message)"
          }
          Write-Host '== environment paths and ACLs =='
          foreach ($name in @('USERPROFILE', 'LOCALAPPDATA', 'APPDATA', 'TEMP', 'TMP', 'RUNNER_TEMP')) {
            $value = [System.Environment]::GetEnvironmentVariable($name)
            Write-Host "$name=$value"
            Show-Acl $value
          }
          Write-Host '== parent owner / ACL (SDDL) =='
          foreach ($name in @('USERPROFILE', 'LOCALAPPDATA', 'TEMP')) {
            $value = [System.Environment]::GetEnvironmentVariable($name)
            if ($value) {
              $parent = Split-Path -Parent $value
              if ($parent) { Show-Acl $parent }
            }
          }
          Write-Host '== raw System.Net.Sockets AF_UNIX probe (owned protected short temp dir, bounded, cleaned up) =='
          $probeParent = [System.Environment]::GetEnvironmentVariable('TEMP')
          if (-not $probeParent) { $probeParent = [System.IO.Path]::GetTempPath() }
          Write-Host "probeParent=$probeParent"
          $probeDir = $null
          $probeSocket = $null
          $listener = $null
          $client = $null
          $accepted = $null
          try {
            for ($attempt = 0; $attempt -lt 8; $attempt++) {
              $candidate = Join-Path $probeParent ('asicenu-' + [guid]::NewGuid().ToString('N').Substring(0, 8))
              if (-not (Test-Path -LiteralPath $candidate)) { $probeDir = $candidate; break }
            }
            if (-not $probeDir) { throw 'could not allocate a fresh probe directory' }
            if (Test-Path -LiteralPath $probeDir) { throw "probe target already exists: $probeDir" }
            $currentUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
            $security = New-Object System.Security.AccessControl.DirectorySecurity
            $security.SetOwner($currentUser)
            $security.SetAccessRuleProtection($true, $false)
            $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
              $currentUser,
              [System.Security.AccessControl.FileSystemRights]::FullControl,
              ([System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor
               [System.Security.AccessControl.InheritanceFlags]::ObjectInherit),
              [System.Security.AccessControl.PropagationFlags]::None,
              [System.Security.AccessControl.AccessControlType]::Allow)
            $security.AddAccessRule($rule)
            New-Item -ItemType Directory -Path $probeDir | Out-Null
            Set-Acl -LiteralPath $probeDir -AclObject $security
            $probeSocket = Join-Path $probeDir 'p.sock'
            $probeDirFull = (Get-Item -LiteralPath $probeDir).FullName
            $probeSocketFull = Join-Path $probeDirFull 'p.sock'
            Write-Host "probeDir=$probeDirFull pathLength=$($probeDirFull.Length) socketPathLength=$($probeSocketFull.Length)"
            Show-Acl $probeDirFull
            $listener = [System.Net.Sockets.Socket]::new(
              [System.Net.Sockets.AddressFamily]::Unix,
              [System.Net.Sockets.SocketType]::Stream,
              [System.Net.Sockets.ProtocolType]::Unspecified)
            $listener.Bind([System.Net.Sockets.UnixDomainSocketEndPoint]::new($probeSocket))
            $listener.Listen(1)
            $client = [System.Net.Sockets.Socket]::new(
              [System.Net.Sockets.AddressFamily]::Unix,
              [System.Net.Sockets.SocketType]::Stream,
              [System.Net.Sockets.ProtocolType]::Unspecified)
            $connect = $client.BeginConnect([System.Net.Sockets.UnixDomainSocketEndPoint]::new($probeSocket), $null, $null)
            if (-not $connect.AsyncWaitHandle.WaitOne(5000)) { throw 'AF_UNIX connect did not complete within 5000ms' }
            $client.EndConnect($connect)
            $accept = $listener.BeginAccept($null, $null)
            if (-not $accept.AsyncWaitHandle.WaitOne(5000)) { throw 'AF_UNIX accept did not complete within 5000ms' }
            $accepted = $listener.EndAccept($accept)
            Write-Host 'AF_UNIX probe=OK'
          } catch {
            Write-Host "AF_UNIX probe=FAIL type=$($_.Exception.GetType().FullName) message=$($_.Exception.Message) hresult=0x$('{0:X8}' -f $_.Exception.HResult)"
          } finally {
            foreach ($socket in @($accepted, $client, $listener)) {
              if ($null -ne $socket) { try { $socket.Dispose() } catch { } }
            }
            try {
              if ($probeSocket -and (Test-Path -LiteralPath $probeSocket)) { Remove-Item -LiteralPath $probeSocket -Force }
              if ($probeDir -and (Test-Path -LiteralPath $probeDir)) { Remove-Item -LiteralPath $probeDir -Force }
            } catch {
              Write-Host "probe cleanup error=$($_.Exception.Message)"
            }
          }
      # The Server 2022 runner's default LOCALAPPDATA is owned by
      # BUILTIN\Administrators (measured: owner=BUILTIN Administrators,
      # protected=False, inherited SYSTEM/Administrators/Users ACEs). The product's
      # verify_runtime_parent requires the exact current-user owner, so worker startup
      # fails there. This step points the offline suites only at a
      # fresh test-only directory owned by the current user with a protected
      # current-user-only FullControl DACL, satisfying the same policy without
      # weakening it or changing the runner image.
      - name: Prepare isolated owned LOCALAPPDATA for the offline suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerTemp = [System.Environment]::GetEnvironmentVariable('RUNNER_TEMP')
          if (-not $runnerTemp) { throw 'RUNNER_TEMP is not set' }
          $fixture = $null
          for ($attempt = 0; $attempt -lt 8; $attempt++) {
            $candidate = Join-Path $runnerTemp ('asicenrt-' + [guid]::NewGuid().ToString('N').Substring(0, 8))
            if (-not (Test-Path -LiteralPath $candidate)) { $fixture = $candidate; break }
          }
          if (-not $fixture) { throw 'could not allocate a fresh CI runtime fixture' }
          if (Test-Path -LiteralPath $fixture) { throw "CI runtime fixture already exists: $fixture" }
          $currentUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $security = New-Object System.Security.AccessControl.DirectorySecurity
          $security.SetOwner($currentUser)
          $security.SetAccessRuleProtection($true, $false)
          $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
            $currentUser,
            [System.Security.AccessControl.FileSystemRights]::FullControl,
            ([System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor
             [System.Security.AccessControl.InheritanceFlags]::ObjectInherit),
            [System.Security.AccessControl.PropagationFlags]::None,
            [System.Security.AccessControl.AccessControlType]::Allow)
          $security.AddAccessRule($rule)
          $created = $false
          try {
            New-Item -ItemType Directory -Path $fixture | Out-Null
            $created = $true
            Set-Acl -LiteralPath $fixture -AclObject $security
            $item = Get-Item -LiteralPath $fixture -Force
            if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "CI runtime fixture is a reparse point: $fixture"
            }
            $acl = Get-Acl -LiteralPath $fixture
            if (-not $acl.AreAccessRulesProtected) {
              throw "CI runtime fixture DACL is not protected: $fixture"
            }
            $ownerSid = $acl.GetOwner([System.Security.Principal.SecurityIdentifier])
            if (-not $ownerSid -or $ownerSid.Value -ne $currentUser.Value) {
              throw "CI runtime fixture owner is not the current user: $fixture"
            }
            foreach ($ace in $acl.Access) {
              $aceSid = $ace.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier])
              if ($ace.IsInherited -or
                  $ace.AccessControlType -ne [System.Security.AccessControl.AccessControlType]::Allow -or
                  $aceSid.Value -ne $currentUser.Value) {
                throw "CI runtime fixture has an unexpected ACE: $($ace.IdentityReference)"
              }
            }
            $fixtureFull = $item.FullName
            $worstWorkerSocket = $fixtureFull.Length + '\asicen-wake-'.Length + 32 + '\w.sock'.Length
            Write-Host "ciRuntimeFixture=$fixtureFull length=$($fixtureFull.Length) worstWorkerSocketPathBytes=$worstWorkerSocket"
            if ($worstWorkerSocket -ge 108) {
              throw "CI runtime fixture path is too long for the worker socket: $worstWorkerSocket UTF-8 bytes"
            }
            Add-Content -Path $env:GITHUB_ENV -Value "LOCALAPPDATA=$fixtureFull"
            Add-Content -Path $env:GITHUB_ENV -Value "ASICEN_CI_RUNTIME_FIXTURE=$fixtureFull"
            Write-Host "LOCALAPPDATA for the offline suites is now $fixtureFull"
          } catch {
            if ($created -and (Test-Path -LiteralPath $fixture)) {
              try {
                if (-not (Get-ChildItem -Force -LiteralPath $fixture)) {
                  Remove-Item -LiteralPath $fixture -Force
                }
              } catch {
                Write-Host "partial fixture cleanup error=$($_.Exception.Message)"
              }
            }
            throw
          }
      - name: Run the cross-built Windows offline test suites
        shell: pwsh
        run: |
          $tests = Join-Path $env:RUNNER_TEMP 'win-candidate-tests'
          $suites = Get-ChildItem $tests -Filter '*tests.exe' | Sort-Object Name
          if (-not $suites) { throw 'no Windows offline test executables were downloaded' }
          $failed = @()
          foreach ($suite in $suites) {
            Write-Host "== $($suite.Name) =="
            & $suite.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAILED $($suite.Name) exit=$($LASTEXITCODE)"
              $failed += "$($suite.Name)=$($LASTEXITCODE)"
            }
          }
          if ($failed.Count -ne 0) {
            throw "Windows offline test suites failed: $($failed -join ', ')"
          }
      - name: Extract and smoke the exact CI-only Windows archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'win-candidate') -Filter *.zip | Select-Object -First 1
          if (-not $archive) { throw 'no Windows CI-only archive downloaded' }
          $extract = Join-Path $env:RUNNER_TEMP 'win-candidate-extract'
          Expand-Archive -Path $archive.FullName -DestinationPath $extract
          foreach ($program in 'asicend', 'asicen-ts', 'asicenctl') {
            & (Join-Path $extract "$program.exe") --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & (Join-Path $extract 'asicend.exe') --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Clean up isolated owned LOCALAPPDATA (always)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = [System.Environment]::GetEnvironmentVariable('ASICEN_CI_RUNTIME_FIXTURE')
          $runnerTemp = [System.Environment]::GetEnvironmentVariable('RUNNER_TEMP')
          if (-not $fixture) { Write-Host 'no isolated CI runtime fixture was created'; exit 0 }
          if (-not $runnerTemp) { throw 'RUNNER_TEMP is not set during cleanup' }
          if (-not (Test-Path -LiteralPath $fixture)) {
            Write-Host "isolated fixture already gone: $fixture"
            exit 0
          }
          $item = Get-Item -LiteralPath $fixture -Force
          $fixtureFull = $item.FullName
          $runnerTempFull = (Get-Item -LiteralPath $runnerTemp -Force).FullName.TrimEnd('\')
          if (-not $fixtureFull.StartsWith($runnerTempFull + '\', [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "refusing to clean a fixture outside RUNNER_TEMP: $fixtureFull"
          }
          if (-not (Split-Path -Leaf $fixtureFull).StartsWith('asicenrt-')) {
            throw "refusing to clean an unexpected fixture name: $fixtureFull"
          }
          if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw "refusing to clean a reparse-point fixture: $fixtureFull"
          }
          $currentUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $acl = Get-Acl -LiteralPath $fixtureFull
          $ownerSid = $acl.GetOwner([System.Security.Principal.SecurityIdentifier])
          if (-not $ownerSid -or $ownerSid.Value -ne $currentUser.Value) {
            throw "fixture owner changed; preserving for inspection: $fixtureFull"
          }
          $residual = @(Get-ChildItem -Force -LiteralPath $fixtureFull)
          if ($residual.Count -ne 0) {
            foreach ($entry in $residual) {
              Write-Host "residual fixture entry: $($entry.FullName) attributes=$($entry.Attributes)"
            }
            throw "product left residual endpoint/worker entries in $fixtureFull; not deleting them"
          }
          Remove-Item -LiteralPath $fixtureFull -Force
          if (Test-Path -LiteralPath $fixtureFull) {
            throw "failed to remove the empty isolated fixture: $fixtureFull"
          }
          Write-Host "removed empty isolated fixture: $fixtureFull"
