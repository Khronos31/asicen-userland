# SPDX-License-Identifier: GPL-2.0-only
name: portable userland foundation

on:
  pull_request:
    paths:
      - CMakeLists.txt
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
      - packaging/**
      - tests/**
      - userland/**
      - third_party/**
      - firmware/**
      - distribution/**
      - scripts/**
      - VERSION
      - .github/workflows/build_userland.yml
  push:
    paths:
      - CMakeLists.txt
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
      - packaging/**
      - tests/**
      - userland/**
      - third_party/**
      - firmware/**
      - distribution/**
      - scripts/**
      - VERSION
      - .github/workflows/build_userland.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-glibc-tests:
    name: Ubuntu glibc x86_64 unit and integration tests
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and run the complete CTest suite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build g++ pkg-config binutils libusb-1.0-0-dev libpcsclite-dev shellcheck
          cmake -S . -B build-userland -G Ninja -DCMAKE_BUILD_TYPE=Release -DASICEN_BUILD_TESTS=ON -DASICEN_REQUIRE_PCSC_IFD=ON
          cmake --build build-userland
          ctest --test-dir build-userland --output-on-failure
      - name: Test packaging and workflow failure boundaries
        run: scripts/test-packaging.sh
      - name: Test libusb compatibility paths
        run: scripts/test-libusb-compatibility.sh

  linux-x86_64:
    name: Linux x86_64 static and libc-qualified IFD
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build static executables in Alpine 3.22
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src alpine:3.22 sh -euxc '
            apk add --no-cache bash git cmake samurai gcc g++ make pkgconf libusb-dev pcsc-lite-dev python3 binutils curl tar bzip2 linux-headers;
            # The bind mount retains the runner UID; trust only this checkout.
            git config --global --add safe.directory /src;
            # libusb 1.0.28 checks usbfs before honoring no-discovery FD mode.
            # Empty bus fixture only: no device nodes, mounts, or USB access.
            mkdir -p /dev/bus/usb/001;
            cmake -S . -B build-userland -G Ninja -DCMAKE_BUILD_TYPE=Release -DASICEN_BUILD_TESTS=ON -DASICEN_REQUIRE_PCSC_IFD=ON;
            cmake --build build-userland;
            ctest --test-dir build-userland --output-on-failure;
            scripts/build-linux-static.sh --output /src/build-static;
            for program in asicend asicen-ts asicenctl; do /src/build-static/$program --help; done'
      - name: Build glibc 2.31 IFD and package both variants
        run: |
          docker run --rm -e GITHUB_SHA="$GITHUB_SHA" -v "$GITHUB_WORKSPACE:/src" -w /src debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9 sh -euxc '
            find /etc/apt/sources.list.d -type f -delete;
            printf "%s\\n" \
              "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260825T000000Z bullseye main" \
              "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260825T000000Z bullseye-security main" \
              > /etc/apt/sources.list;
            apt_install_retry() {
              attempt=1;
              while [ "$attempt" -le 3 ]; do
                find /var/lib/apt/lists -mindepth 1 -depth -delete;
                if apt-get update && apt-get install -y --no-install-recommends "$@"; then return 0; fi
                [ "$attempt" -lt 3 ] || return 1;
                sleep "$attempt";
                attempt=$((attempt + 1));
              done
            };
            apt_install_retry git cmake ninja-build g++ pkg-config libpcsclite-dev binutils python3;
            # The bind mount retains the runner UID; trust only this checkout.
            git config --global --add safe.directory /src;
            scripts/build-linux-ifd.sh --libc glibc --output /src/build-ifd-glibc;
            python3 -c "import ctypes; getattr(ctypes.CDLL(\"/src/build-ifd-glibc/asicen-userland-ifd.so\"), \"IFDHCreateChannel\")";
            scripts/package-artifact.sh --platform linux-glibc-x86_64 --version "$(tr -d "\n" < VERSION)" --static-build-dir build-static --ifd-library build-ifd-glibc/asicen-userland-ifd.so --reader-template packaging/pcsc/reader.conf.d/asicen-userland.conf.in --source-ref "$GITHUB_SHA" --output-dir release-candidate;
            true'
      - name: Build and test matching musl IFD
        run: |
          docker run --rm -e GITHUB_SHA="$GITHUB_SHA" -v "$GITHUB_WORKSPACE:/src" -w /src alpine:3.22 sh -euxc '
            apk add --no-cache git cmake samurai g++ pkgconf pcsc-lite-dev python3 binutils tar bzip2 linux-headers;
            # The bind mount retains the runner UID; trust only this checkout.
            git config --global --add safe.directory /src;
            scripts/build-linux-ifd.sh --libc musl --output /src/build-ifd-musl;
            python3 -c "import ctypes; getattr(ctypes.CDLL(\"/src/build-ifd-musl/asicen-userland-ifd.so\"), \"IFDHCreateChannel\")";
            scripts/package-artifact.sh --platform linux-musl-x86_64 --version "$(tr -d "\n" < VERSION)" --static-build-dir build-static --ifd-library build-ifd-musl/asicen-userland-ifd.so --reader-template packaging/pcsc/reader.conf.d/asicen-userland.conf.in --source-ref "$GITHUB_SHA" --output-dir release-candidate;
            extracted=/tmp/packaged-musl-x86_64; mkdir -p "$extracted";
            tar -xzf release-candidate/asicen-userland-$(tr -d "\n" < VERSION)-linux-musl-x86_64.tar.gz -C "$extracted";
            for program in asicend asicen-ts asicenctl; do "$extracted/$program" --help; done;
            find "$extracted" -depth -delete'
      - name: Audit and static start checks on Ubuntu
        run: |
          version="$(tr -d '\n' < VERSION)"
          for libc in glibc musl; do scripts/audit-artifact.sh --platform "linux-$libc-x86_64" --archive "release-candidate/asicen-userland-$version-linux-$libc-x86_64.tar.gz"; done
          for program in asicend asicen-ts asicenctl; do build-static/$program --help; done
          sudo chown -R "$(id -u):$(id -g)" build-userland build-static build-ifd-glibc build-ifd-musl release-candidate
      - name: Upload Linux x86_64 candidate archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-linux-x86_64
          path: release-candidate/*.tar.gz
          if-no-files-found: error
      - name: Clean mounted Linux build outputs
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" build-userland build-static build-ifd-glibc build-ifd-musl release-candidate 2>/dev/null || true
          for path in build-userland build-static build-ifd-glibc build-ifd-musl release-candidate; do
            if [ -e "$path" ]; then find "$path" -depth -delete; fi
          done

  linux-aarch64:
    name: Linux aarch64 static and libc-qualified IFD
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build static and matching IFD variants in Alpine 3.22
        run: |
          docker run --rm -e GITHUB_SHA="$GITHUB_SHA" -v "$GITHUB_WORKSPACE:/src" -w /src alpine:3.22 sh -euxc '
            apk add --no-cache bash git cmake samurai gcc g++ make pkgconf libusb-dev pcsc-lite-dev python3 binutils curl tar bzip2 linux-headers;
            # The bind mount retains the runner UID; trust only this checkout.
            git config --global --add safe.directory /src;
            # libusb 1.0.28 checks usbfs before honoring no-discovery FD mode.
            # Empty bus fixture only: no device nodes, mounts, or USB access.
            mkdir -p /dev/bus/usb/001;
            cmake -S . -B build-userland -G Ninja -DCMAKE_BUILD_TYPE=Release -DASICEN_BUILD_TESTS=ON -DASICEN_REQUIRE_PCSC_IFD=ON;
            cmake --build build-userland;
            ctest --test-dir build-userland --output-on-failure;
            scripts/build-linux-static.sh --output /src/build-static;
            scripts/build-linux-ifd.sh --libc musl --output /src/build-ifd-musl;
            python3 -c "import ctypes; getattr(ctypes.CDLL(\"/src/build-ifd-musl/asicen-userland-ifd.so\"), \"IFDHCreateChannel\")";
            scripts/package-artifact.sh --platform linux-musl-aarch64 --version "$(tr -d "\n" < VERSION)" --static-build-dir build-static --ifd-library build-ifd-musl/asicen-userland-ifd.so --reader-template packaging/pcsc/reader.conf.d/asicen-userland.conf.in --source-ref "$GITHUB_SHA" --output-dir release-candidate;
            extracted=/tmp/packaged-musl-aarch64; mkdir -p "$extracted";
            tar -xzf release-candidate/asicen-userland-$(tr -d "\n" < VERSION)-linux-musl-aarch64.tar.gz -C "$extracted";
            for program in asicend asicen-ts asicenctl; do "$extracted/$program" --help; done;
            find "$extracted" -depth -delete'
          # glibc IFD is built on a Debian 11 aarch64 runner to prove the 2.31 floor.
          docker run --rm -e GITHUB_SHA="$GITHUB_SHA" -v "$GITHUB_WORKSPACE:/src" -w /src debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9 sh -euxc '
            find /etc/apt/sources.list.d -type f -delete;
            printf "%s\\n" \
              "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260825T000000Z bullseye main" \
              "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260825T000000Z bullseye-security main" \
              > /etc/apt/sources.list;
            apt_install_retry() {
              attempt=1;
              while [ "$attempt" -le 3 ]; do
                find /var/lib/apt/lists -mindepth 1 -depth -delete;
                if apt-get update && apt-get install -y --no-install-recommends "$@"; then return 0; fi
                [ "$attempt" -lt 3 ] || return 1;
                sleep "$attempt";
                attempt=$((attempt + 1));
              done
            };
            apt_install_retry git cmake ninja-build g++ pkg-config libpcsclite-dev python3 binutils;
            # The bind mount retains the runner UID; trust only this checkout.
            git config --global --add safe.directory /src;
            scripts/build-linux-ifd.sh --libc glibc --output /src/build-ifd-glibc;
            python3 -c "import ctypes; getattr(ctypes.CDLL(\"/src/build-ifd-glibc/asicen-userland-ifd.so\"), \"IFDHCreateChannel\")";
            scripts/package-artifact.sh --platform linux-glibc-aarch64 --version "$(tr -d "\n" < VERSION)" --static-build-dir build-static --ifd-library build-ifd-glibc/asicen-userland-ifd.so --reader-template packaging/pcsc/reader.conf.d/asicen-userland.conf.in --source-ref "$GITHUB_SHA" --output-dir release-candidate'
      - name: Audit candidate archives
        run: |
          version="$(tr -d '\n' < VERSION)"
          for program in asicend asicen-ts asicenctl; do build-static/$program --help; done
          for libc in glibc musl; do scripts/audit-artifact.sh --platform "linux-$libc-aarch64" --archive "release-candidate/asicen-userland-$version-linux-$libc-aarch64.tar.gz"; done
          sudo chown -R "$(id -u):$(id -g)" build-userland build-static build-ifd-glibc build-ifd-musl release-candidate
      - name: Upload Linux aarch64 candidate archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-linux-aarch64
          path: release-candidate/*.tar.gz
          if-no-files-found: error
      - name: Clean mounted Linux build outputs
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" build-userland build-static build-ifd-glibc build-ifd-musl release-candidate 2>/dev/null || true
          for path in build-userland build-static build-ifd-glibc build-ifd-musl release-candidate; do
            if [ -e "$path" ]; then find "$path" -depth -delete; fi
          done

  static-start-x86_64:
    name: Downloaded static x86_64 executable start checks
    needs: linux-x86_64
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-linux-x86_64
          path: ${{ runner.temp }}/downloaded-x86_64
      - name: Start exact downloaded static executables
        run: |
          set -eu
          for archive in "$RUNNER_TEMP"/downloaded-x86_64/*.tar.gz; do
            extract="$RUNNER_TEMP/extract-$(basename "$archive" .tar.gz)"
            mkdir -p "$extract"
            tar -xzf "$archive" -C "$extract"
            for program in asicend asicen-ts asicenctl; do "$extract/$program" --help; done
          done
          find "$RUNNER_TEMP/downloaded-x86_64" "$RUNNER_TEMP"/extract-* -depth -delete 2>/dev/null || true

  static-start-aarch64:
    name: Downloaded static aarch64 executable start checks
    needs: linux-aarch64
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-linux-aarch64
          path: ${{ runner.temp }}/downloaded-aarch64
      - name: Start exact downloaded static executables
        run: |
          set -eu
          for archive in "$RUNNER_TEMP"/downloaded-aarch64/*.tar.gz; do
            extract="$RUNNER_TEMP/extract-$(basename "$archive" .tar.gz)"
            mkdir -p "$extract"
            tar -xzf "$archive" -C "$extract"
            for program in asicend asicen-ts asicenctl; do "$extract/$program" --help; done
          done
          find "$RUNNER_TEMP/downloaded-aarch64" "$RUNNER_TEMP"/extract-* -depth -delete 2>/dev/null || true

  source-relink-x86_64:
    name: Corresponding-source static relink proof x86_64
    needs: source-archive
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-source
          path: ${{ runner.temp }}/source-archive
      - name: Relink modified libusb source in Alpine
        run: |
          set -eu
          source_root="$RUNNER_TEMP/source-root"
          mkdir -p "$source_root"
          tar -xzf "$RUNNER_TEMP"/source-archive/*.tar.gz -C "$source_root"
          docker run --rm -v "$source_root:/src" -w /src/repository alpine:3.22 sh -euxc '
            apk add --no-cache git cmake samurai gcc g++ make pkgconf python3 binutils curl tar bzip2 linux-headers;
            test -f /src/third_party/libusb-1.0.30.tar.bz2;
            scripts/test-static-relink.sh --libusb-source-archive /src/third_party/libusb-1.0.30.tar.bz2'
          find "$source_root" -depth -delete

  source-relink-aarch64:
    name: Corresponding-source static relink proof aarch64
    needs: source-archive
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-source
          path: ${{ runner.temp }}/source-archive
      - name: Relink modified libusb source in native Alpine
        run: |
          set -eu
          source_root="$RUNNER_TEMP/source-root"
          mkdir -p "$source_root"
          tar -xzf "$RUNNER_TEMP"/source-archive/*.tar.gz -C "$source_root"
          docker run --rm -v "$source_root:/src" -w /src/repository alpine:3.22 sh -euxc '
            apk add --no-cache git cmake samurai gcc g++ make pkgconf python3 binutils curl tar bzip2 linux-headers;
            test -f /src/third_party/libusb-1.0.30.tar.bz2;
            scripts/test-static-relink.sh --libusb-source-archive /src/third_party/libusb-1.0.30.tar.bz2'
          find "$source_root" -depth -delete

  source-relink-macos:
    name: Corresponding-source static relink proof macOS arm64
    needs: source-archive
    timeout-minutes: 60
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-source
          path: ${{ runner.temp }}/source-archive
      - name: Relink modified libusb source on macOS
        run: |
          set -eu
          brew install ninja
          source_root="$RUNNER_TEMP/source-root"
          mkdir -p "$source_root"
          tar -xzf "$RUNNER_TEMP"/source-archive/*.tar.gz -C "$source_root"
          test -f "$source_root/third_party/libusb-1.0.30.tar.bz2"
          cd "$source_root/repository"
          scripts/test-static-relink.sh --libusb-source-archive "$source_root/third_party/libusb-1.0.30.tar.bz2"
          cd "$RUNNER_TEMP"
          find "$source_root" -depth -delete

  macos:
    name: macOS
    timeout-minutes: 60
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: |
          brew install ninja pcsc-lite pkgconf
          command -v otool
          command -v nm
          command -v strip
      - name: Report macOS toolchain
        run: |
          echo "runner ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --show-sdk-version
          clang --version
          ld -v
          cmake --version
          ninja --version
          brew list --versions ninja pcsc-lite pkgconf
          libusb="$RUNNER_TEMP/libusb-1.0.30.tar.bz2"
          curl -fsSL --retry 2 -o "$libusb" \
            https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
          echo 'fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf  '"$libusb" | shasum -a 256 -c -
          shasum -a 256 "$libusb"
      - name: Build with static libusb 1.0.30 and test
        run: |
          pcsc_prefix="$(brew --prefix pcsc-lite)"
          pcsc_include="$pcsc_prefix/include/PCSC"
          PKG_CONFIG_PATH="$pcsc_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export PKG_CONFIG_PATH
          pkg-config --modversion libpcsclite
          scripts/build-macos-static.sh --build-dir build-userland --pcsc-include-dir "$pcsc_include" --tests \
            --libusb-source-archive "$RUNNER_TEMP/libusb-1.0.30.tar.bz2"
          test "$(sed -n 's/^ASICEN_PCSC_IFD_INCLUDE_DIR:PATH=//p' build-userland/CMakeCache.txt)" = "$pcsc_include"
          ctest --test-dir build-userland -R '^(px4-pcsc-ifd-tests|asicen-ifd-prefix-tests-macos|asicen_ifd_symbols)$' --no-tests=error --output-on-failure
          ctest --test-dir build-userland --output-on-failure
          ctest --test-dir build-userland -R '^asicen-libusb-capture-lifecycle-tests$' --repeat until-fail:20 --output-on-failure
          version="$(tr -d '\n' < VERSION)"
          mkdir -p "$RUNNER_TEMP/release-candidate/macos"
          scripts/package-artifact.sh --platform darwin-arm64 --version "$version" \
            --build-dir build-userland --ifd-bundle build-userland/asicen-userland-ifd.bundle \
            --reader-template packaging/pcsc/reader.conf.d/asicen-userland.conf.in \
            --source-ref "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/release-candidate/macos"
          extract="$RUNNER_TEMP/packaged-macos"
          mkdir -p "$extract"
          tar -xzf "$RUNNER_TEMP/release-candidate/macos/asicen-userland-$version-darwin-arm64.tar.gz" -C "$extract"
          for program in asicend asicen-ts asicenctl; do
            otool -L "$extract/$program"
            if otool -L "$extract/$program" | grep -F libusb; then exit 1; fi
            "$extract/$program" --help
          done
          python3 scripts/macos-ifd-bundle-smoke.py \
            "$extract/ifd/asicen-userland-ifd.bundle/Contents/MacOS/libasicen-userland-ifd.dylib" \
            build-userland/asicend-mock
          find "$extract" -depth -delete
      - name: Upload macOS candidate archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-macos
          path: ${{ runner.temp }}/release-candidate/macos/*.tar.gz
          if-no-files-found: error

  android-api-24:
    needs: source-archive
    name: Android API 24 build, package, and audit
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
            abi: arm64-v8a
            platform: android-aarch64
          - name: armv7a
            abi: armeabi-v7a
            platform: android-armv7a
          - name: x86_64
            abi: x86_64
            platform: android-x86_64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-source
          path: ${{ runner.temp }}/source-archive
      - uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        id: setup-ndk
        with:
          ndk-version: r27d
          add-to-path: false
      - name: Install Android build tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y binutils cmake ninja-build shellcheck
      - name: Check Termux launcher
        run: |
          shellcheck packaging/termux/asicen-termux tests/test-asicen-termux.sh
          tests/test-asicen-termux.sh
      - name: Build Android command-line artifacts
        env:
          ABI: ${{ matrix.abi }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          artifact_root="$RUNNER_TEMP/release-candidate/$ABI"
          mkdir -p "$artifact_root"
          scripts/build-android.sh --abi "$ABI" \
            --output "$artifact_root/output" --evidence "$artifact_root/evidence"
          version="$(tr -d '\n' < VERSION)"
          scripts/package-artifact.sh --platform "${{ matrix.platform }}" --version "$version" \
            --build-dir "$artifact_root/output" --binary-suffix "$ABI" \
            --libusb-source-archive "$artifact_root/evidence/libusb/libusb-1.0.30.tar.bz2" \
            --ndk-root "$ANDROID_NDK_HOME" \
            --link-map-dir "$artifact_root/evidence/maps" \
            --source-ref "$GITHUB_SHA" \
            --output-dir "$artifact_root/package"
          if [ "$ABI" = x86_64 ]; then
            source_root="$RUNNER_TEMP/android-relink-source"
            mkdir -p "$source_root"
            tar -xzf "$RUNNER_TEMP"/source-archive/*.tar.gz -C "$source_root"
            "$source_root/repository/scripts/test-android-libusb-relink.sh" --abi x86_64 \
              --libusb-archive "$source_root/third_party/libusb-1.0.30.tar.bz2"
            find "$source_root" -depth -delete
          fi
      - name: Upload Android candidate archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-${{ matrix.name }}
          path: ${{ runner.temp }}/release-candidate/${{ matrix.abi }}/package/*.tar.gz
          if-no-files-found: error

  source-archive:
    name: Corresponding source archive
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Build and audit source archive
        run: |
          libusb="$RUNNER_TEMP/libusb-1.0.30.tar.bz2"
          curl -fsSL --retry 2 -o "$libusb" \
            https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
          echo 'fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf  '"$libusb" | sha256sum -c -
          version="$(tr -d '\n' < VERSION)"
          mkdir -p "$RUNNER_TEMP/release-candidate/source"
          scripts/package-source.sh --version "$version" --source-root "$GITHUB_WORKSPACE" \
            --source-ref "$GITHUB_SHA" --libusb-source-archive "$libusb" \
            --output-dir "$RUNNER_TEMP/release-candidate/source"
      - name: Upload source candidate archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-source
          path: ${{ runner.temp }}/release-candidate/source/*.tar.gz
          if-no-files-found: error

  release-candidate:
    name: Assemble release-candidate artifact
    needs: [ubuntu-glibc-tests, linux-x86_64, linux-aarch64, static-start-x86_64, static-start-aarch64, source-relink-x86_64, source-relink-aarch64, source-relink-macos, macos, android-api-24, source-archive, windows-x86_64, windows-native-tests]
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rc-*
          merge-multiple: true
          path: release-candidate
      # Windows is built, packaged, and tested in CI, but is not distributed in
      # 0.1.0. Restore the commented Windows entries here when WinSCard lands
      # for the planned 0.2.x Windows release, and change the archive count to 10.
      # - name: Download the tested Windows candidate archive
      #   uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      #   with:
      #     name: win-candidate
      #     path: release-candidate
      - name: Install native ELF audit tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y binutils
      - name: Verify and checksum candidate archives
        run: |
          set -eu
          version="$(python3 - <<'PY'
          from pathlib import Path
          import re

          data = Path('VERSION').read_bytes()
          if not data.endswith(b'\n') or data.count(b'\n') != 1:
              raise SystemExit('VERSION must contain exactly one newline')
          version = data[:-1].decode('ascii')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('VERSION must contain strict N.N.N')
          print(version)
          PY
          )"
          python3 - "$version" <<'PY'
          from pathlib import Path
          import sys
          import json
          import os
          import tarfile
          import zipfile

          version = sys.argv[1]
          expected = {
              f'asicen-userland-{version}-linux-glibc-x86_64.tar.gz',
              f'asicen-userland-{version}-linux-musl-x86_64.tar.gz',
              f'asicen-userland-{version}-linux-glibc-aarch64.tar.gz',
              f'asicen-userland-{version}-linux-musl-aarch64.tar.gz',
              f'asicen-userland-{version}-darwin-arm64.tar.gz',
              f'asicen-userland-{version}-android-aarch64.tar.gz',
              f'asicen-userland-{version}-android-armv7a.tar.gz',
              f'asicen-userland-{version}-android-x86_64.tar.gz',
              # f'asicen-userland-{version}-windows-x86_64.zip',
              f'asicen-userland-{version}-source.tar.gz',
          }
          actual = {
              path.name for path in Path('release-candidate').iterdir()
              if path.is_file() and (path.name.endswith('.tar.gz') or path.name.endswith('.zip'))
          }
          if len(actual) != 9 or actual != expected:
              raise SystemExit(f'exact archive set required: expected={sorted(expected)}, actual={sorted(actual)}')
          for name in sorted(actual):
              archive = Path('release-candidate') / name
              if name.endswith('.zip'):
                  with zipfile.ZipFile(archive) as stream:
                      manifest = json.loads(stream.read('manifest.json'))
              else:
                  with tarfile.open(archive, 'r:gz') as stream:
                      member = 'source-manifest.json' if name.endswith('-source.tar.gz') else 'manifest.json'
                      manifest = json.load(stream.extractfile(member))
              source_ref = manifest.get('repository_commit') if name.endswith('-source.tar.gz') else manifest.get('source_ref')
              if source_ref != os.environ['GITHUB_SHA']:
                  raise SystemExit(f'{name}: candidate source commit mismatch: {source_ref}')
          PY
          cd release-candidate
          linux_glibc_archive="asicen-userland-$version-linux-glibc-x86_64.tar.gz"
          linux_musl_archive="asicen-userland-$version-linux-musl-x86_64.tar.gz"
          linux_glibc_aarch64_archive="asicen-userland-$version-linux-glibc-aarch64.tar.gz"
          linux_musl_aarch64_archive="asicen-userland-$version-linux-musl-aarch64.tar.gz"
          macos_archive="asicen-userland-$version-darwin-arm64.tar.gz"
          android_aarch64_archive="asicen-userland-$version-android-aarch64.tar.gz"
          android_armv7a_archive="asicen-userland-$version-android-armv7a.tar.gz"
          android_x86_64_archive="asicen-userland-$version-android-x86_64.tar.gz"
          # windows_archive="asicen-userland-$version-windows-x86_64.zip"
          source_archive="asicen-userland-$version-source.tar.gz"
          ../scripts/audit-artifact.sh --platform linux-glibc-x86_64 --archive "$linux_glibc_archive"
          ../scripts/audit-artifact.sh --platform linux-musl-x86_64 --archive "$linux_musl_archive"
          ../scripts/audit-artifact.sh --platform linux-glibc-aarch64 --archive "$linux_glibc_aarch64_archive"
          ../scripts/audit-artifact.sh --platform linux-musl-aarch64 --archive "$linux_musl_aarch64_archive"
          ../scripts/audit-artifact.sh --platform darwin-arm64 --archive "$macos_archive"
          ../scripts/audit-artifact.sh --platform android-aarch64 --archive "$android_aarch64_archive"
          ../scripts/audit-artifact.sh --platform android-armv7a --archive "$android_armv7a_archive"
          ../scripts/audit-artifact.sh --platform android-x86_64 --archive "$android_x86_64_archive"
          # ../scripts/audit-artifact.sh --platform windows-x86_64 --archive "$windows_archive"
          ../scripts/audit-artifact.sh --source-archive --archive "$source_archive"
          # Restore "$windows_archive" in the checksum input list for the 0.2.x Windows release.
          sha256sum "$linux_glibc_archive" "$linux_musl_archive" "$linux_glibc_aarch64_archive" \
            "$linux_musl_aarch64_archive" "$macos_archive" "$android_aarch64_archive" \
            "$android_armv7a_archive" "$android_x86_64_archive" "$source_archive" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload single release-candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: release-candidate
          if-no-files-found: error

  release-candidate-linux-ubuntu-x86_64:
    name: Release candidate Linux x86_64 Ubuntu artifact smoke
    needs: release-candidate
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
      - name: Run exact candidate static CLIs and glibc IFD on Ubuntu
        run: |
          set -eu
          version="$(tr -d '\n' < VERSION)"
          for libc in glibc musl; do
            archive="$RUNNER_TEMP/release-candidate/asicen-userland-$version-linux-$libc-x86_64.tar.gz"
            extract="$RUNNER_TEMP/rc-$libc-x86_64"
            mkdir -p "$extract"
            tar -xzf "$archive" -C "$extract"
            for program in asicend asicen-ts asicenctl; do "$extract/$program" --help; done
          done
          python3 -c "import ctypes; getattr(ctypes.CDLL('$RUNNER_TEMP/rc-glibc-x86_64/ifd/asicen-userland-ifd.so'), 'IFDHCreateChannel')"
          find "$RUNNER_TEMP/release-candidate" "$RUNNER_TEMP"/rc-*-x86_64 -depth -delete

  release-candidate-linux-alpine-x86_64:
    name: Release candidate Linux x86_64 Alpine artifact smoke
    needs: release-candidate
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
      - name: Run exact candidate static CLIs and musl IFD in Alpine
        run: |
          version="$(tr -d '\n' < VERSION)"
          docker run --rm -e VERSION="$version" -v "$RUNNER_TEMP/release-candidate:/artifacts:ro" alpine:3.22 sh -euxc '
            apk add --no-cache python3 tar;
            version="$VERSION";
            for libc in glibc musl; do
              archive="/artifacts/asicen-userland-$version-linux-$libc-x86_64.tar.gz";
              extract="/tmp/rc-$libc-x86_64";
              mkdir -p "$extract";
              tar -xzf "$archive" -C "$extract";
              for program in asicend asicen-ts asicenctl; do "$extract/$program" --help; done;
            done;
            python3 -c "import ctypes; getattr(ctypes.CDLL(\"/tmp/rc-musl-x86_64/ifd/asicen-userland-ifd.so\"), \"IFDHCreateChannel\")"'

