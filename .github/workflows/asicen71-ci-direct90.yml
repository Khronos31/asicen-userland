# SPDX-License-Identifier: GPL-2.0-only
name: ASICEN71 macOS lifecycle direct90 diagnostic

on:
  push:
    branches:
      - asicen71-ci-direct90-20261029

permissions:
  contents: read

jobs:
  macos-lifecycle-direct90:
    name: macOS 14 lifecycle direct run with 90-second watchdog
    timeout-minutes: 15
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 1b25f11016cc87933559086788c1eff1ac7e41a2

      - name: Install build tools and record toolchain
        run: |
          set -eu
          brew install ninja pcsc-lite pkgconf
          mkdir -p "$RUNNER_TEMP/asicen71-direct90"
          pcsc_prefix="$(brew --prefix pcsc-lite)"
          export PKG_CONFIG_PATH="$pcsc_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          {
            printf 'source_commit='; git rev-parse HEAD
            printf 'source_tree='; git rev-parse 'HEAD^{tree}'
            printf 'core_pin='; cat cmake/dtv-userland-core.revision
            printf 'runner_image=%s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            sw_vers
            xcode-select -p
            xcodebuild -version
            xcrun --show-sdk-version
            clang --version
            ld -v
            cmake --version
            ninja --version
            brew list --versions ninja pcsc-lite pkgconf
            pkg-config --modversion libpcsclite
          } | tee "$RUNNER_TEMP/asicen71-direct90/build-info.txt"

      - name: Build only the fixed-tree lifecycle target
        run: |
          set -eu
          diag="$RUNNER_TEMP/asicen71-direct90"
          archive="$diag/libusb-1.0.30.tar.bz2"
          curl -fsSL --retry 2 -o "$archive" \
            https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
          echo 'fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf  '"$archive" | shasum -a 256 -c -
          shasum -a 256 "$archive" | tee -a "$diag/build-info.txt"

          work=$(mktemp -d "$RUNNER_TEMP/asicen71-libusb.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/source" build-userland/libusb-static
          tar -xjf "$archive" -C "$work/source" --strip-components=1
          prefix="$PWD/build-userland/libusb-static"
          . scripts/libusb-reproducibility.sh
          libusb_cflags=$(libusb_reproducible_cflags "$work/source" "$work")
          (cd "$work/source" && CFLAGS="$libusb_cflags" ./configure --prefix="$prefix" --disable-shared --enable-static \
            --disable-examples-build --disable-tests-build --disable-dependency-tracking &&
            make -j"$(sysctl -n hw.ncpu)" && make install)

          pcsc_prefix="$(brew --prefix pcsc-lite)"
          pcsc_include="$pcsc_prefix/include/PCSC"
          export PKG_CONFIG_PATH="$pcsc_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          libs_private=$(sed -n 's/^Libs\.private:[[:space:]]*//p' "$prefix/lib/pkgconfig/libusb-1.0.pc")
          cmake -S . -B build-userland -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DASICEN_BUILD_TESTS=ON -DASICEN_ENABLE_LIBUSB=ON \
            -DASICEN_LIBUSB_INCLUDE_DIR="$prefix/include/libusb-1.0" \
            -DASICEN_LIBUSB_LIBRARY="$prefix/lib/libusb-1.0.a" \
            -DASICEN_LIBUSB_LINK_LIBRARIES="$libs_private" \
            -DASICEN_REQUIRE_PCSC_IFD=ON \
            -DASICEN_PCSC_IFD_INCLUDE_DIR:PATH="$pcsc_include"
          cmake --build build-userland --target asicen-libusb-capture-lifecycle-tests
          binary=build-userland/asicen-libusb-capture-lifecycle-tests
          shasum -a 256 "$binary" | tee -a "$diag/build-info.txt"
          lipo -archs "$binary" | tee -a "$diag/build-info.txt"
          grep -E '^(ASICEN_BUILD_TESTS|ASICEN_ENABLE_LIBUSB|ASICEN_REQUIRE_PCSC_IFD|ASICEN_PCSC_IFD_INCLUDE_DIR|CMAKE_BUILD_TYPE):' \
            build-userland/CMakeCache.txt | tee -a "$diag/build-info.txt"

      - name: Run lifecycle binary once with external 90-second watchdog
        run: |
          set -eu
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time

          diag = os.path.join(os.environ["RUNNER_TEMP"], "asicen71-direct90")
          binary = os.path.abspath("build-userland/asicen-libusb-capture-lifecycle-tests")
          log_path = os.path.join(diag, "lifecycle.log")
          meta_path = os.path.join(diag, "run-metadata.json")
          stack_path = os.path.join(diag, "timeout-stack.txt")
          start = time.monotonic()
          with open(log_path, "wb", buffering=0) as log:
              child = subprocess.Popen([binary], stdin=subprocess.DEVNULL,
                                       stdout=log, stderr=subprocess.STDOUT)
              timed_out = False
              stack_result = "not-needed"
              try:
                  exit_code = child.wait(timeout=90.0)
              except subprocess.TimeoutExpired:
                  timed_out = True
                  try:
                      sampled = subprocess.run(["sample", str(child.pid), "1", "1",
                                                "-file", stack_path],
                                               stdout=subprocess.DEVNULL,
                                               stderr=subprocess.STDOUT,
                                               timeout=4.0, check=False)
                      stack_result = "sample-exit-%d" % sampled.returncode
                  except (OSError, subprocess.TimeoutExpired) as error:
                      stack_result = "sample-unavailable-%s" % type(error).__name__
                  try:
                      child.terminate()
                  except ProcessLookupError:
                      pass
                  try:
                      exit_code = child.wait(timeout=5.0)
                  except subprocess.TimeoutExpired:
                      child.kill()
                      exit_code = child.wait(timeout=5.0)
          elapsed = time.monotonic() - start
          with open(log_path, "rb") as log:
              output = log.read().decode("utf-8", errors="replace")
          runs = re.findall(r"^\[\s*RUN\s*\]\s*(.*?)\s*$", output, re.MULTILINE)
          passed = re.findall(r"^\[\s*OK\s*\]\s*(.*?)\s+\((\d+) ms\)$",
                              output, re.MULTILINE)
          failed = re.findall(r"^\[\s*FAILED\s*\]\s*(.*?)\s+\((\d+) ms\)$",
                              output, re.MULTILINE)
          metadata = {
              "start_monotonic": start,
              "elapsed_seconds": elapsed,
              "watchdog_seconds": 90,
              "exit_code": exit_code,
              "timed_out": timed_out,
              "run_count": len(runs),
              "ok_count": len(passed),
              "failed_count": len(failed),
              "last_run_case": runs[-1] if runs else None,
              "last_completed_case": (passed[-1][0] if passed else
                                       failed[-1][0] if failed else None),
              "timeout_stack_capture": stack_result,
          }
          with open(meta_path, "w", encoding="utf-8") as meta:
              json.dump(metadata, meta, indent=2)
              meta.write("\n")
          sys.stdout.write(output)
          print(json.dumps(metadata, indent=2))
          sys.exit(124 if timed_out else exit_code)
          PY

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asicen71-macos-lifecycle-direct90
          path: ${{ runner.temp }}/asicen71-direct90/
          if-no-files-found: warn
          retention-days: 14
