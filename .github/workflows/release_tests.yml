# SPDX-License-Identifier: GPL-2.0-only
name: Shared release automation offline tests

on:
  pull_request:
    paths:
      - .github/workflows/**
      - scripts/**
      - tests/**
      - third_party/release-automation/**
      - docs/releasing.md
      - docs/release-automation-provenance.md
  push:
    paths:
      - .github/workflows/**
      - scripts/**
      - tests/**
      - third_party/release-automation/**
      - docs/releasing.md
      - docs/release-automation-provenance.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-shared-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read the exact ASICEN commit under test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run both product profiles and mocked GitHub safety tests
        run: python3 -m unittest discover -s tests -p 'test_release_*.py' -v
