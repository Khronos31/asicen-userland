name: Fetch and inspect ASICEN drivers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends file binutils kmod python3 ca-certificates
      - name: Fetch and inspect
        run: python3 scripts/fetch_drivers.py
      - name: Upload driver metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asicen-driver-metadata
          path: |
            out/fetch-status.txt
            out/analysis/inventory.txt
            out/analysis/*.meta.txt
          if-no-files-found: warn
          retention-days: 3
