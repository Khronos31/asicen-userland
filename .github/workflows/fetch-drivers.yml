name: Fetch and inspect ASICEN drivers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends file binutils kmod python3 ca-certificates
      - name: Fetch and inspect
        run: python3 scripts/fetch_drivers.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asicen-driver-research
          path: out/
          if-no-files-found: warn
          retention-days: 3