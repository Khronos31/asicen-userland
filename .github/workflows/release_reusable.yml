# SPDX-License-Identifier: GPL-2.0-only
name: Embedded verified ASICEN Stable publication

on:
  workflow_call:
    inputs:
      product:
        description: Exact supported product profile and repository identity
        required: true
        type: string
      verifier-ref:
        description: Exact ASICEN tag commit SHA, identical to this local reusable workflow
        required: true
        type: string

permissions: {}

jobs:
  verify:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.event.deleted == false &&
      inputs.product == 'asicen-userland' && github.repository == 'Khronos31/asicen-userland'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      contents: read
      actions: read
    outputs:
      verifier-ref: ${{ steps.verifier.outputs.sha }}
    steps:
      - name: Require an immutable verifier revision
        id: verifier
        env:
          VERIFIER_REF: ${{ inputs.verifier-ref }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          revision = os.environ['VERIFIER_REF']
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('Verifier revision must be an exact commit SHA')
          repository = os.environ['GITHUB_REPOSITORY']
          # Trusted-local policy: GitHub resolves ./ reusable workflows from the
          # caller's own commit. Only ASICEN may use this embedded copy; the
          # helper checkout must be that exact commit, never a PX4 ref or branch.
          if repository != 'Khronos31/asicen-userland':
              raise SystemExit('Unapproved caller repository')
          if revision != os.environ['GITHUB_SHA']:
              raise SystemExit('Local reusable workflow and verifier revision differ')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('sha=' + revision + '\n')
          PY
      - name: Read exact embedded verifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Khronos31/asicen-userland
          ref: ${{ inputs.verifier-ref }}
          persist-credentials: false
          path: release-tools
      - name: Verify candidate, reproducibility, tag build, and payloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          VERIFIER_REF: ${{ inputs.verifier-ref }}
        run: |
          test "$(git -C release-tools rev-parse HEAD)" = "$VERIFIER_REF"
          python3 release-tools/scripts/release_publish.py verify \
            --product "$PRODUCT" --report "$RUNNER_TEMP/release-verification.json"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-verification.json
          if-no-files-found: warn

  publish:
    needs: verify
    if: >-
      needs.verify.result == 'success' && github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') && github.event.deleted == false &&
      inputs.product == 'asicen-userland' && github.repository == 'Khronos31/asicen-userland'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require an immutable verifier revision
        env:
          VERIFIER_REF: ${{ needs.verify.outputs.verifier-ref }}
        run: |
          [[ "$VERIFIER_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$VERIFIER_REF" = "$GITHUB_SHA"
      - name: Read exact embedded verifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Khronos31/asicen-userland
          ref: ${{ needs.verify.outputs.verifier-ref }}
          persist-credentials: false
          path: release-tools
      - name: Reverify, resume Draft, verify downloads, publish Latest, verify again
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          VERIFIER_REF: ${{ needs.verify.outputs.verifier-ref }}
        run: |
          test "$(git -C release-tools rev-parse HEAD)" = "$VERIFIER_REF"
          python3 release-tools/scripts/release_publish.py publish \
            --product "$PRODUCT" --report "$RUNNER_TEMP/release-publication.json"
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-publication.json
          if-no-files-found: warn
