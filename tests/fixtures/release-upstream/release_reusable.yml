# SPDX-License-Identifier: GPL-2.0-only
name: Shared verified Stable publication

on:
  workflow_call:
    inputs:
      product:
        description: Exact supported product profile and repository identity
        required: true
        type: string
      verifier-ref:
        description: Full PX4 commit SHA, identical to the caller's reusable-workflow pin
        required: true
        type: string

permissions: {}

jobs:
  verify:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.event.deleted == false &&
      ((inputs.product == 'px4-userland' && github.repository == 'Khronos31/px4-userland') ||
       (inputs.product == 'asicen-userland' && github.repository == 'Khronos31/asicen-userland'))
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      contents: read
      actions: read
    outputs:
      verifier-ref: ${{ steps.verifier.outputs.sha }}
    steps:
      - name: Require an immutable verifier revision
        id: verifier
        env:
          VERIFIER_REF: ${{ inputs.verifier-ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          from urllib.request import HTTPRedirectHandler, Request, build_opener
          revision = os.environ['VERIFIER_REF']
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('Verifier revision must be an exact commit SHA')
          repository = os.environ['GITHUB_REPOSITORY']
          if repository == 'Khronos31/px4-userland':
              if revision != os.environ['GITHUB_SHA']:
                  raise SystemExit('Local reusable workflow and verifier revision differ')
          elif repository == 'Khronos31/asicen-userland':
              class NoRedirect(HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              run_id = int(os.environ['GITHUB_RUN_ID'])
              request = Request(f'https://api.github.com/repos/{repository}/actions/runs/{run_id}', headers={
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
              })
              with build_opener(NoRedirect()).open(request, timeout=60) as response:
                  raw = response.read(2 * 1024 * 1024 + 1)
              if len(raw) > 2 * 1024 * 1024:
                  raise SystemExit('Workflow identity response exceeds safety limit')
              run = json.loads(raw)
              path = 'Khronos31/px4-userland/.github/workflows/release_reusable.yml'
              references = [item for item in run.get('referenced_workflows', [])
                            if item.get('path', '').split('@')[0] == path]
              if (run.get('id') != run_id or run.get('head_sha') != os.environ['GITHUB_SHA'] or
                  run.get('repository', {}).get('full_name') != repository or
                  run.get('event') != 'push' or len(references) != 1 or
                  references[0].get('path') != path + '@' + revision or
                  references[0].get('sha') != revision):
                  raise SystemExit('Called reusable workflow and verifier SHA are not the same immutable revision')
          else:
              raise SystemExit('Unapproved caller repository')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('sha=' + revision + '\n')
          PY
      - name: Read exact shared verifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Khronos31/px4-userland
          ref: ${{ inputs.verifier-ref }}
          persist-credentials: false
          path: release-tools
      - name: Verify candidate, reproducibility, tag build, and payloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          VERIFIER_REF: ${{ inputs.verifier-ref }}
        run: |
          test "$(git -C release-tools rev-parse HEAD)" = "$VERIFIER_REF"
          python3 release-tools/scripts/release_publish.py verify \
            --product "$PRODUCT" --report "$RUNNER_TEMP/release-verification.json"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-verification.json
          if-no-files-found: warn

  publish:
    needs: verify
    if: >-
      needs.verify.result == 'success' && github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require an immutable verifier revision
        env:
          VERIFIER_REF: ${{ needs.verify.outputs.verifier-ref }}
        run: |
          [[ "$VERIFIER_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - name: Read exact shared verifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Khronos31/px4-userland
          ref: ${{ needs.verify.outputs.verifier-ref }}
          persist-credentials: false
          path: release-tools
      - name: Reverify, resume Draft, verify downloads, publish Latest, verify again
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          VERIFIER_REF: ${{ needs.verify.outputs.verifier-ref }}
        run: |
          test "$(git -C release-tools rev-parse HEAD)" = "$VERIFIER_REF"
          python3 release-tools/scripts/release_publish.py publish \
            --product "$PRODUCT" --report "$RUNNER_TEMP/release-publication.json"
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-publication.json
          if-no-files-found: warn
