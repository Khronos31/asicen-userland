# BusyBox mdev hotplug rules for ASICEN runtime functions and firmware loaders.
# Prepend this fragment to /etc/mdev.conf, before generic USB/$MODALIAS rules.
# The hotplug rule includes DEVTYPE and PRODUCT and is intentionally exact.
DEVTYPE=usb_device;PRODUCT=b06/1/.*;bus/usb/[0-9]+/[0-9]+ root:video 0660
DEVTYPE=usb_device;PRODUCT=b06/3/.*;bus/usb/[0-9]+/[0-9]+ root:video 0660
DEVTYPE=usb_device;PRODUCT=b06/4/.*;bus/usb/[0-9]+/[0-9]+ root:video 0660
DEVTYPE=usb_device;PRODUCT=b06/5/.*;bus/usb/[0-9]+/[0-9]+ root:video 0660
DEVTYPE=usb_device;PRODUCT=b06/6/.*;bus/usb/[0-9]+/[0-9]+ root:video 0660
DEVTYPE=usb_device;PRODUCT=1738/5211/.*;bus/usb/[0-9]+/[0-9]+ root:video 0660
DEVTYPE=usb_device;PRODUCT=1738/5216/.*;bus/usb/[0-9]+/[0-9]+ root:video 0660
